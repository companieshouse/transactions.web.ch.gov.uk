<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/baseLayout}" lang="en">

<head>
  <title>Confirm your statements</title>
</head>
<body>
<div id="presenter-statements-content" layout:fragment="content">

  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">

      <h1 class="govuk-heading-l">Confirm your statements</h1>

      <div th:if="${individualUser != null}" class="govuk-inset-text" id="presenter-identity-details">
        <p class="govuk-body">
          <strong>Name:</strong> <span th:text="${individualUser.name}">Name</span><br/>
          <strong>Date of birth:</strong> <span th:text="${individualUser.dob}">DOB</span>
        </p>
      </div>

      <p class="govuk-body">
        Select all statements that apply to you and then confirm.
      </p>

      <div th:if="${param.error != null}" class="govuk-error-summary" data-module="govuk-error-summary">
        <div role="alert">
          <h2 class="govuk-error-summary__title">There is a problem</h2>
          <div class="govuk-error-summary__body">
            <ul class="govuk-list govuk-error-summary__list">
              <li>You must select at least one statement</li>
            </ul>
          </div>
        </div>
      </div>

      <form method="post" th:action="@{/transaction/{id}/presenter/statements(id=${transactionId})}">

        <div class="govuk-form-group"
             th:classappend="${param.error != null ? 'govuk-form-group--error' : ''}">
          <fieldset class="govuk-fieldset">
            <legend class="govuk-fieldset__legend govuk-fieldset__legend--m">
              <h2 class="govuk-fieldset__heading">Which of the following apply to you?</h2>
            </legend>

            <div class="govuk-checkboxes" data-module="govuk-checkboxes">
              <div class="govuk-checkboxes__item" th:each="statement, stat : ${statements}">
                <input class="govuk-checkboxes__input"
                       type="checkbox"
                       name="selectedStatements"
                       th:id="${'statement-' + stat.index}"
                       th:value="${statement}" />
                <label class="govuk-label govuk-checkboxes__label"
                       th:for="${'statement-' + stat.index}"
                       th:text="${statement}">Statement</label>
              </div>
            </div>
          </fieldset>
        </div>

        <button type="submit" class="govuk-button" data-module="govuk-button">
          Confirm &amp; continue
        </button>

      </form>

    </div>
  </div>

</div>
</body>
</html>
